[tox]
skipsdist = True
envlist = py{311,312,313,314}
requires =
  tox>=4.22
  tox-uv

[testenv:{unit,py311,py312,py313,py314,py}]
description = unit testing
runner = uv-venv-lock-runner
passenv = *
# uv.lock holds duckdb at the md extra's pin; keep testing the latest release here
allowlist_externals = uv
commands_pre = uv pip install --python {envpython} --upgrade duckdb
commands = {envpython} -m pytest {posargs} tests/unit
dependency_groups = dev

[testenv:{functional,py311,py312,py313,py314,py}]
description = adapter functional testing
runner = uv-venv-lock-runner
passenv = *
# uv.lock holds duckdb at the md extra's pin; keep testing the latest release here
allowlist_externals = uv
commands_pre = uv pip install --python {envpython} --upgrade duckdb
commands = {envpython} -m pytest {posargs} tests/functional/adapter
dependency_groups = dev

[testenv:{filebased,py311,py312,py313,py314,py}]
description = adapter functional testing using file-based DBs
runner = uv-venv-lock-runner
passenv = *
# uv.lock holds duckdb at the md extra's pin; keep testing the latest release here
allowlist_externals = uv
commands_pre = uv pip install --python {envpython} --upgrade duckdb
commands = {envpython} -m pytest --profile=file {posargs} tests/functional/adapter
dependency_groups = dev

[testenv:{buenavista,py311}]
description = adapter functional testing using a Buena Vista server
runner = uv-venv-lock-runner
passenv = *
# duckdb comes from uv.lock, which holds it at the md extra's pin
commands = {envpython} -m pytest --profile=buenavista {posargs} tests/functional/adapter
dependency_groups = dev

[testenv:{md,py311}]
description = adapter function testing using MotherDuck
runner = uv-venv-lock-runner
passenv = *
commands = {envpython} -m pytest --profile=md --maxfail=2 {posargs} tests/functional/plugins/motherduck tests/functional/adapter
dependency_groups = dev
extras = md

[testenv:{md-flights,py311}]
description = Python models submitted to MotherDuck Flights (runs real Flights)
runner = uv-venv-lock-runner
passenv = *
setenv =
  DBT_DUCKDB_TEST_FLIGHTS = 1
commands = {envpython} -m pytest --profile=md {posargs} tests/functional/plugins/motherduck/test_motherduck_flights.py
dependency_groups = dev
extras = md

[testenv:{fsspec,py311,py312,py313,py314,py}]
description = adapter fsspec testing
runner = uv-venv-lock-runner
passenv = *
# uv.lock holds duckdb at the md extra's pin; keep testing the latest release here
allowlist_externals = uv
commands_pre = uv pip install --python {envpython} --upgrade duckdb
commands = {envpython} -m pytest {posargs} tests/functional/fsspec
dependency_groups = dev

[testenv:{plugins,py311,py312,py313,py314,py}]
description = adapter plugin testing
runner = uv-venv-lock-runner
passenv = *
# duckdb comes from uv.lock, which holds it at the md extra's pin
commands = {envpython} -m pytest {posargs} --profile=file tests/functional/plugins
dependency_groups = dev

[testenv:{nightly,py311,py312,py313,py314,py}]
description = duckdb nightly release testing
skip_install = True
# tox-uv venvs do not seed pip; this env upgrades duckdb in-place via pip
uv_seed = True
passenv = *
commands =
  {envpython} -m pip install --upgrade --pre duckdb
  {envpython} -m pip show duckdb
  {envpython} -m pytest {posargs} --profile=nightly tests/unit tests/functional/adapter
dependency_groups = dev
deps =
  -e.

# The nightly-* envs run the remaining suites against the latest DuckDB pre-release.
# Community extensions are not published for pre-releases, so those tests are deselected.
[testenv:nightly-file]
description = duckdb nightly release testing using file-based DBs
skip_install = True
# tox-uv venvs do not seed pip; this env upgrades duckdb in-place via pip
uv_seed = True
passenv = *
commands =
  {envpython} -m pip install --upgrade --pre duckdb
  {envpython} -m pip show duckdb
  {envpython} -m pytest --profile=file -k "not CommunityExtensions" {posargs} tests/functional/adapter
dependency_groups = dev
deps =
  -e.

[testenv:nightly-plugins]
description = duckdb nightly release plugin testing
skip_install = True
# tox-uv venvs do not seed pip; this env upgrades duckdb in-place via pip
uv_seed = True
passenv = *
commands =
  {envpython} -m pip install --upgrade --pre duckdb
  {envpython} -m pip show duckdb
  {envpython} -m pytest --profile=file {posargs} tests/functional/plugins tests/functional/fsspec
dependency_groups = dev
deps =
  -e.

[testenv:nightly-ducklake]
description = duckdb nightly release testing using a local DuckLake database
skip_install = True
# tox-uv venvs do not seed pip; this env upgrades duckdb in-place via pip
uv_seed = True
passenv = *
commands =
  {envpython} -m pip install --upgrade --pre duckdb
  {envpython} -m pip show duckdb
  {envpython} -m pytest --database-type=ducklake -k "not CommunityExtensions" {posargs} tests/functional/adapter
dependency_groups = dev
deps =
  -e.

[testenv:ducklake]
description = adapter functional testing using a local DuckLake database
runner = uv-venv-lock-runner
passenv = *
# uv.lock holds duckdb at the md extra's pin; keep testing the latest release here
allowlist_externals = uv
commands_pre = uv pip install --python {envpython} --upgrade duckdb
commands = {envpython} -m pytest --database-type=ducklake {posargs} tests/functional/adapter
dependency_groups = dev

[testenv:md-ducklake]
description = adapter functional testing using a managed DuckLake database in MotherDuck
runner = uv-venv-lock-runner
passenv = *
commands = {envpython} -m pytest --profile=md --database-type=ducklake --maxfail=2 {posargs} tests/functional/plugins/motherduck tests/functional/adapter
dependency_groups = dev
extras = md
