version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # Reads pyproject.toml and keeps uv.lock in sync. The previous "pip" entry
  # tracked dev-requirements.txt, which no longer exists.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
